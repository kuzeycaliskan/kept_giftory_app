# Supabase Free pauses the project after 7 days of API inactivity (a paused
# project does NOT wake on its own — manual dashboard restore required). App
# usage + the daily birthday cron normally count as activity; this ping is
# the mathematical guarantee. Delete this workflow after upgrading to Pro.
name: supabase-keepalive
on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: REST ping (publishable key — ships in the client, not a secret)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://fezdcmvhnuvvaivogwvf.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: sb_publishable_mtoE8HJNsQA9W1c4b2POqw_ov4TI0vk")
          echo "status: $code"
          # 2xx (RLS returns an empty list) and 401/403 all mean the project
          # is up; a paused project yields connection errors / 5xx.
          case "$code" in
            2*|401|403) exit 0 ;;
            *) echo "::error::Supabase unreachable (project may be paused)"; exit 1 ;;
          esac
