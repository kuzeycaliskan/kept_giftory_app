# Kept — static analysis. Senior-level bar per CLAUDE.md (§7).
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/gen/**"
    - build/**
    - android/**
    - ios/**
  errors:
    todo: ignore
    # Freezed constructor-parameter @JsonKey is the documented pattern.
    invalid_annotation_target: ignore

linter:
  rules:
    # Namespacing constants/factories in a private-constructor class is an
    # intentional style here (Env, AppTheme).
    avoid_classes_with_only_static_members: false
    # This is an app, not a published package — no API-doc requirement.
    public_member_api_docs: false
    # Single-method repository interfaces are an intentional architectural
    # seam (CLAUDE.md §3), not accidental abstraction.
    one_member_abstracts: false
    # Repositories catch everything at the data boundary and map it to a
    # typed Failure (CLAUDE.md §5); an `on` clause there would only let
    # unexpected errors escape the Result contract.
    avoid_catches_without_on_clauses: false
    # Returning a repository Future straight through an async function is
    # deliberate (no extra microtask, same error path); `await` adds noise.
    async_return_with_no_await: false
    # Typed closure parameters are kept where they document intent
    # (callbacks on sheets, builders) — readability over brevity.
    avoid_types_on_closure_parameters: false
